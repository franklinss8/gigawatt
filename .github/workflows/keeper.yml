name: keeper

on:
  schedule:
    - cron: "7 * * * *"      # hourly at :07 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore flush_interval (FORCE_FLUSH=1)"
        type: boolean
        default: false
      dry_run:
        description: "Compute only, send nothing (DRY_RUN=1)"
        type: boolean
        default: false

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run keeper
        working-directory: apps/keeper
        env:
          NEXT_PUBLIC_CLUSTER: ${{ vars.CLUSTER || 'devnet' }}
          RPC_URL: ${{ secrets.RPC_URL }}
          NEXT_PUBLIC_PROGRAM_ID: ${{ vars.PROGRAM_ID }}
          NEXT_PUBLIC_GWATT_MINT: ${{ vars.GWATT_MINT }}
          NEXT_PUBLIC_WATT_MINT: ${{ vars.WATT_MINT }}
          NEXT_PUBLIC_USDC_MINT: ${{ vars.USDC_MINT }}
          KEEPER_KEYPAIR: ${{ secrets.KEEPER_KEYPAIR }}
          WEB_URL: ${{ vars.WEB_URL }}
          KEEPER_SECRET: ${{ secrets.KEEPER_SECRET }}
          EXCLUDED_ADDRESSES: ${{ vars.EXCLUDED_ADDRESSES }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          MOCK_FEES: ${{ vars.MOCK_FEES || '0' }}
          MOCK_FEES_LAMPORTS: ${{ vars.MOCK_FEES_LAMPORTS }}
          MOCK_SWAP: ${{ vars.MOCK_SWAP }}
          MOCK_USDC_AUTHORITY_KEYPAIR: ${{ secrets.MOCK_USDC_AUTHORITY_KEYPAIR }}
          MOCK_SOL_PRICE_USD: ${{ vars.MOCK_SOL_PRICE_USD }}
          JUP_API: ${{ vars.JUP_API }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          FORCE_FLUSH: ${{ inputs.force && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: pnpm start
